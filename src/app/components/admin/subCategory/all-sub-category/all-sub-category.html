<div class="management-container">

  <!-- Page Header -->
  <div class="header-actions">

    <div class="page-heading">

      <span class="heading-icon">
        account_tree
      </span>

      <div>
        <h2>Subcategory Management</h2>

        <p>
          Manage your product subcategories
        </p>
      </div>

    </div>


    <button
      mat-raised-button
      class="add-category-btn"
      (click)="showAddSubcategory()"
    >

      <mat-icon>
        add
      </mat-icon>

      Add Subcategory

    </button>

  </div>


  <!-- Subcategories Table -->
  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="dataSource"
      class="subcategory-table"
    >


      <!-- Subcategory Name -->
      <ng-container matColumnDef="name">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Subcategory Name
        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="category-name"
        >

          <div
            class="category-name-wrapper"
          >

            <span class="category-icon">
              category
            </span>

            <span>
              {{ subcategory.name }}
            </span>

          </div>

        </td>

      </ng-container>


      <!-- Parent Category -->
      <ng-container matColumnDef="category">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Category
        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="category-column"
        >

          <span class="parent-category">

            {{
              subcategory.categoryName ||
              getCategoryName(subcategory.categoryId)
            }}

          </span>

        </td>

      </ng-container>


      <!-- Description -->
      <ng-container
        matColumnDef="description"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Description
        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="description"
        >

          {{
            subcategory.description ||
            'No description available'
          }}

        </td>

      </ng-container>


      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header"
        >
          Actions
        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="actions-cell"
        >

          <button
            mat-icon-button
            class="edit-btn"
            matTooltip="Edit subcategory"
            (click)="editSubcategory(subcategory)"
          >

            <mat-icon>
              edit
            </mat-icon>

          </button>


          <button
            mat-icon-button
            class="delete-btn"
            matTooltip="Delete subcategory"
            (click)="deleteSubcategory(subcategory.id)"
          >

            <mat-icon>
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- Header -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>


      <!-- Rows -->
      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        "
      ></tr>


    </table>

  </div>

</div>
